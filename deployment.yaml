apiVersion: apps/v1
kind: Deployment
metadata:
  name: set13-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rollout-app
  template:
    metadata:
      labels:
        app: rollout-app
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.23.0-alpine
        ports:
        - containerPort: 80
