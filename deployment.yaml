apiVersion: apps/v1
kind: Deployment
metadata:
  name: set12-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: set12-app
  template:
    metadata:
      labels:
        app: set12-app
    spec:
      containers:
      - name: set12-container
        image: nginx:alpine
        ports:
        - containerPort: 80
