apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-app
  template:
    metadata:
      labels:
        app: final-app
    spec:
      containers:
      - name: web-container
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: final-service
spec:
  type: NodePort
  selector:
    app: final-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
